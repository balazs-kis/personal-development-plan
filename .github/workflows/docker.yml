# Builds the site image and publishes it to GHCR: ghcr.io/<owner>/<repo>, tagged latest + commit SHA.
# The server only pulls it (deploy/compose.yaml); nothing is built there.

name: Docker image

on:
  push:
    branches: [main]
    # Only what ends up in the image; docs or deploy/ changes don't need a new one.
    paths:
      - frontend/**
      - backend/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR with the built-in GITHUB_TOKEN

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (npm ci, dotnet restore) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
